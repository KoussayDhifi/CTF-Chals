<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Granted - FST Gateway</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .success-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
        }
        
        .success-box {
            text-align: center;
            padding: 40px;
            background: rgba(48, 43, 99, 0.3);
            border: 2px solid #00ff88;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
            max-width: 500px;
        }
        
        .success-box h1 {
            color: #00ff88;
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5em;
            margin: 0;
            text-shadow: 0 0 10px #00ff88;
        }
        
        .success-box p {
            color: #e0e0e0;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1em;
            margin-top: 20px;
        }
        
        .flag {
            margin-top: 30px;
            padding: 20px;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid #00ff88;
            border-radius: 5px;
        }
        
        .flag-label {
            color: #00ff88;
            font-weight: bold;
            font-family: 'Rajdhani', sans-serif;
        }
        
        .flag-value {
            color: #00ff88;
            font-family: 'Courier New', monospace;
            font-size: 1.2em;
            margin-top: 10px;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="success-box">
            <h1>✓ ACCESS GRANTED</h1>
            <p>Welcome to the FST Secure Access Gateway</p>
            <div class="flag">
                <div class="flag-label">You've successfully extracted the password!</div>
                <div class="flag-value">Sup3r@S3c4etP@$$</div>
                <a href="{{ url_for('phaseTwo') }}">Click here to move to next phase</a>
            </div>
        </div>
    </div>
</body>
</html>
