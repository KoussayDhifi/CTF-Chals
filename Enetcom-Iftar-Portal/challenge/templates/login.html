<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Enectom-Iftar | Login</title>
    <style>
        :root {
            --bg: #0b0f14;
            --card: #121826;
            --accent: #ffb703;
            --text: #eaeaea;
            --muted: #9aa4b2;
            --border: #ffb703;
        }
        * { box-sizing: border-box; font-family: "JetBrains Mono", monospace; }
        body {
            margin: 0; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background: radial-gradient(circle at top, #1a2238, var(--bg));
            color: var(--text);
        }
        .container {
            width: 380px; background: var(--card); padding: 28px;
            border-radius: 12px; border: 1px solid var(--border);
            box-shadow: 0 15px 50px rgba(0,0,0,0.6);
        }
        h1 { text-align: center; font-size: 24px; margin-bottom: 8px; color: var(--accent);}
        .subtitle { text-align: center; font-size: 12px; color: var(--muted); margin-bottom: 25px;}
        label { display: block; margin-bottom: 6px; font-size: 13px;}
        input { width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 6px; border: 1px solid var(--border); background: #0f131f; color: var(--text);}
        input:focus { outline: none; border-color: #ffb703; }
        button {
            width: 100%; padding: 11px; border: none; border-radius: 6px;
            background: linear-gradient(135deg, #ffb703, #d98f04); color: #0b0f14; font-weight: bold; cursor: pointer;
        }
        button:hover { opacity: 0.9; }
        .footer { text-align: center; font-size: 12px; color: var(--muted); margin-top: 16px;}
        .footer a { color: var(--accent); text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Enectom-Iftar Portal</h1>
    <div class="subtitle">Staff & Student Secure Access</div>

    {% if error %}
        <div style="background-color: #ff4d4d; color: white; padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: center;">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">
        <label>Username</label>
        <input type="text" name="username" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button type="submit">Authenticate</button>
    </form>

    <div class="footer">
        New? <a href="/register">Request Access</a> — may your Iftar be blessed 🌙
    </div>
</div>

</body>
</html>
