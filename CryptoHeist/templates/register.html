{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div style="max-width: 420px; margin: 4rem auto;">
  <div style="text-align:center; margin-bottom: 2rem;">
    <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">⬡</div>
    <h1 style="font-size: 1.5rem; font-weight: 800;">Create an Account</h1>
    <p class="text-muted" style="font-size:0.88rem; margin-top:0.3rem;">New users receive $5.00 in starting balance.</p>
  </div>
  <div class="card">
    <div class="card-body">
      <form method="POST">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input class="form-control" type="text" name="username" placeholder="choose_a_username" required autofocus>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input class="form-control" type="password" name="password" placeholder="••••••••" required>
        </div>
        <button class="btn btn-primary" style="width:100%; justify-content:center; padding: 0.75rem;" type="submit">
          Create Account →
        </button>
      </form>
    </div>
  </div>
  <p style="text-align:center; margin-top:1rem; font-size:0.85rem; color: var(--muted);">
    Already registered? <a href="{{ url_for('login') }}">Sign in</a>
  </p>
</div>
{% endblock %}
